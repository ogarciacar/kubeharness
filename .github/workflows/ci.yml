name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - run: go vet ./... && go vet -tags e2e ./...
      - run: go mod tidy -diff
      - run: go test -race -count=1 ./...
      - name: examples/orders
        run: |
          go -C examples/orders/service vet ./...
          go -C examples/orders/service mod tidy -diff
          go -C examples/orders/service test -race -count=1 ./...
          go -C examples/orders vet ./... && go -C examples/orders vet -tags e2e ./...
          go -C examples/orders mod tidy -diff
      - name: examples/gateway
        run: |
          go -C examples/gateway/backend vet ./...
          go -C examples/gateway/backend mod tidy -diff
          go -C examples/gateway/backend test -race -count=1 ./...
          go -C examples/gateway vet ./... && go -C examples/gateway vet -tags e2e ./...
          go -C examples/gateway mod tidy -diff
          go -C examples/gateway test -race -count=1 ./...
      - name: examples/mcp
        run: |
          go -C examples/mcp/calculator vet ./...
          go -C examples/mcp/calculator mod tidy -diff
          go -C examples/mcp/calculator test -race -count=1 ./...
          go -C examples/mcp vet ./... && go -C examples/mcp vet -tags e2e ./...
          go -C examples/mcp mod tidy -diff
          go -C examples/mcp test -race -count=1 ./internal/mcpprobe/...
      - name: hack/render
        run: |
          go -C hack/render vet ./...
          go -C hack/render mod tidy -diff

  render:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: hack/render/go.mod
      - name: rendered profile manifests match their pins
        run: go -C hack/render run . -check

  e2e:
    needs: unit
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: go test -race -tags e2e -count=1 -timeout 25m -v ./...
      - name: leaks
        if: always()
        run: hack/leaks.sh

  m01:
    needs: unit
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: go -C examples/orders test -race -tags e2e -count=1 -timeout 25m -v ./...
      - name: leaks
        if: always()
        run: hack/leaks.sh '^(kh|m01-baseline)-' 

  gateway:
    needs: unit
    runs-on: ubuntu-26.04
    # Dual profiles roughly double G01–G03; keep headroom for baseline and negatives.
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v4.2.3
      - run: go -C examples/gateway test -race -tags e2e -count=1 -timeout 40m -v ./...
      - name: leaks
        if: always()
        run: hack/leaks.sh '^(kh|g01-baseline)-'

  mcp:
    needs: unit
    runs-on: ubuntu-26.04
    # AgentGateway only; headroom for broken-wiring helpers and image pulls.
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: go -C examples/mcp test -race -tags e2e -count=1 -timeout 30m -v ./...
      - name: leaks
        if: always()
        run: hack/leaks.sh '^(kh|a01-baseline)-'
