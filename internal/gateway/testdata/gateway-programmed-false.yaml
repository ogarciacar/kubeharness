apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: edge
  namespace: default
  generation: 1
spec:
  gatewayClassName: kubeharness
  listeners:
    - name: http
      protocol: HTTP
      port: 80
status:
  conditions:
    - type: Accepted
      status: "True"
      reason: Accepted
      message: The Gateway has been scheduled by Envoy Gateway
      observedGeneration: 1
    - type: Programmed
      status: "False"
      reason: AddressNotAssigned
      message: No addresses have been assigned to the Gateway
      observedGeneration: 1
