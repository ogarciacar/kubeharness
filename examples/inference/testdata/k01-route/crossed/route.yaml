apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: llm
spec:
  parentRefs: [{name: edge}]
  hostnames: [llm.example]
  rules:
    - matches: [{path: {type: PathPrefix, value: /m/qwen/}}]
      backendRefs: [{group: agentgateway.dev, kind: AgentgatewayBackend, name: smol}]
    - matches: [{path: {type: PathPrefix, value: /m/smol/}}]
      backendRefs: [{group: agentgateway.dev, kind: AgentgatewayBackend, name: qwen}]
    - matches: [{path: {type: PathPrefix, value: /m/gemma/}}]
      backendRefs: [{group: agentgateway.dev, kind: AgentgatewayBackend, name: gemma}]
