apiVersion: apps/v1
kind: Deployment
metadata:
  name: orders
spec:
  replicas: 1
  selector:
    matchLabels: {app: orders}
  template:
    metadata:
      labels: {app: orders}
    spec:
      containers:
        - name: orders
          image: kubeharness.local/orders:test
          imagePullPolicy: Never
          env:
            - name: PGPASSWORD
              valueFrom: {secretKeyRef: {name: postgres, key: password}}
            - {name: DATABASE_URL, value: "postgres://orders:$(PGPASSWORD)@postgres:5432/orders"}
          ports: [{name: http, containerPort: 8080}]
          readinessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 1
---
apiVersion: v1
kind: Service
metadata:
  name: orders
spec:
  selector: {app: orders}
  ports: [{port: 80, targetPort: http}]
