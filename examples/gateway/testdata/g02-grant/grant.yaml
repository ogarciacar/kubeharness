# This directory is the Delete argument. Do not add a Namespace or a workload.
# v1beta1 is the storage version of the pinned Gateway API CRD. v1 is served
# and the API server converts it to this version.
apiVersion: gateway.networking.k8s.io/v1beta1
kind: ReferenceGrant
metadata:
  name: payments
  namespace: payments
spec:
  from:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      namespace: shop
  to:
    - group: ""
      kind: Service
      name: payments
