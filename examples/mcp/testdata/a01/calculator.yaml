apiVersion: apps/v1
kind: Deployment
metadata:
  name: calculator
spec:
  replicas: 1
  selector:
    matchLabels: {app: calculator}
  template:
    metadata:
      labels: {app: calculator}
    spec:
      containers:
        - name: calculator
          image: kubeharness.local/mcp-calculator:test
          imagePullPolicy: Never
          ports: [{name: mcp, containerPort: 8080}]
          readinessProbe:
            httpGet: {path: /healthz, port: mcp}
            periodSeconds: 1
---
apiVersion: v1
kind: Service
metadata:
  name: calculator
spec:
  selector: {app: calculator}
  ports:
    - name: mcp
      port: 80
      targetPort: mcp
