# Service path break that can stay RouteReady.
# Readiness stays on container port 8080. targetPort 8081 is closed,
# so WaitReady and RouteReady can succeed while the proxy cannot reach the process.
apiVersion: v1
kind: Service
metadata:
  name: calculator
spec:
  selector: {app: calculator}
  ports: [{port: 80, targetPort: 8081}]
