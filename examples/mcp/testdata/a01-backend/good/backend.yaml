# One static target. static.backendRef replaces host only. port, path, and
# protocol stay on the target. prefixMode, failureMode, and sessionRouting
# stay unset, so one target uses the default Conditional prefix and lists
# sum unprefixed.
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayBackend
metadata:
  name: calculator
spec:
  mcp:
    targets:
      - name: calculator
        static:
          backendRef: {name: calculator}
          port: 80
          path: /mcp
          protocol: StreamableHTTP
